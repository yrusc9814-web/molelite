name: mac-build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          cache: false

      - name: 准备
        run: mkdir -p out/logs out/shots

      - name: swift build
        id: build
        continue-on-error: true
        working-directory: app
        run: |
          set -o pipefail
          swift build 2>&1 | tee ../out/logs/swift-build.log
          grep -E 'error:' ../out/logs/swift-build.log | sort -u > ../out/logs/swift-build-errors.txt || true

      - name: swift test
        id: test
        if: steps.build.outcome == 'success'
        continue-on-error: true
        working-directory: app
        run: |
          set -o pipefail
          swift test 2>&1 | tee ../out/logs/swift-test.log

      - name: 打包 MoleLite.app
        id: pack
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          chmod +x app/scripts/build-app.sh engine/bin/*.sh || true
          app/scripts/build-app.sh 2>&1 | tee out/logs/build-app.log

      - name: 截图（只读预览，不执行删除）
        id: shots
        if: steps.pack.outcome == 'success'
        continue-on-error: true
        run: |
          APP="$PWD/app/build/MoleLite.app"
          shot() {
            file=$1; name=$2; wait=$3; shift 3
            pkill -x MoleLite || true; sleep 1
            open -n "$APP" --args -MoleLiteStartSection "$name" "$@"
            sleep "$wait"
            screencapture -x "out/shots/$file.png"
          }
          shot about about 10
          shot clean clean 90 -MoleLiteAutoScan 1
          shot clean-review clean 90 -MoleLiteAutoScan 1 -MoleLiteAutoReview 1
          shot analyze analyze 60
          shot uninstall uninstall 60 -MoleLiteAutoScan 1 -MoleLiteAutoApp Chrome
          pkill -x MoleLite || true

      - name: go test ./cmd/analyze/...
        id: gotest
        continue-on-error: true
        working-directory: engine
        run: |
          set -o pipefail
          go test ./cmd/analyze/... 2>&1 | tee ../out/logs/go-test.log

      - name: bats（提交信息含 [bats] 才跑）
        id: bats
        if: contains(github.event.head_commit.message, '[bats]') || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        timeout-minutes: 30
        working-directory: engine
        run: |
          set -o pipefail
          brew install bats-core >/dev/null 2>&1 || true
          bats --tap tests/ 2>&1 | tee ../out/logs/bats.log

      - name: 汇总并推到 ci-out 分支
        if: always()
        run: |
          {
            echo "commit: $GITHUB_SHA"
            echo "swift build: ${{ steps.build.outcome }}"
            echo "swift test:  ${{ steps.test.outcome }}"
            echo "打包:        ${{ steps.pack.outcome }}"
            echo "截图:        ${{ steps.shots.outcome }}"
            echo "go test:     ${{ steps.gotest.outcome }}"
            echo "bats:        ${{ steps.bats.outcome }}"
            if [ -f out/logs/bats.log ]; then echo "bats not ok: $(grep -c '^not ok' out/logs/bats.log || true) / $(grep -cE '^(not )?ok' out/logs/bats.log || true)"; fi
          } | tee out/summary.txt
          cat out/summary.txt >> "$GITHUB_STEP_SUMMARY"
          cd out
          git init -q -b ci-out
          git add -A
          git -c user.name=ci -c user.email=ci@local commit -qm "ci $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-out
