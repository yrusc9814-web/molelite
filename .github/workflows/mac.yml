name: mac-build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          cache: false

      - name: 环境信息
        run: |
          sw_vers; swift --version; go version
          mkdir -p out/logs out/shots

      - name: swift build
        id: build
        continue-on-error: true
        working-directory: app
        run: swift build 2>&1 | tee ../out/logs/swift-build.log; exit ${PIPESTATUS[0]}

      - name: swift test
        id: test
        continue-on-error: true
        working-directory: app
        run: swift test 2>&1 | tee ../out/logs/swift-test.log; exit ${PIPESTATUS[0]}

      - name: 打包 MoleLite.app
        id: pack
        continue-on-error: true
        run: |
          chmod +x app/scripts/build-app.sh engine/bin/*.sh engine/mole engine/mo || true
          app/scripts/build-app.sh 2>&1 | tee out/logs/build-app.log; exit ${PIPESTATUS[0]}

      - name: 截图（只读预览，不执行删除）
        id: shots
        if: steps.pack.outcome == 'success'
        continue-on-error: true
        run: |
          APP=app/build/MoleLite.app
          shot() {
            name=$1; wait=$2; shift 2
            pkill -x MoleLite || true; sleep 1
            open -n "$APP" --args -MoleLiteStartSection "$name" "$@"
            sleep "$wait"
            osascript -e 'tell application "MoleLite" to activate' || true
            sleep 2
            screencapture -x "out/shots/$name.png" || echo "screencapture 失败: $name"
          }
          shot about 8
          shot clean 90 -MoleLiteAutoScan 1
          shot analyze 60
          shot uninstall 60 -MoleLiteAutoScan 1
          pkill -x MoleLite || true
          ls -la out/shots

      - name: go test ./cmd/analyze/...
        id: gotest
        continue-on-error: true
        working-directory: engine
        run: go test ./cmd/analyze/... 2>&1 | tee ../out/logs/go-test.log; exit ${PIPESTATUS[0]}

      - name: bats（引擎全量）
        id: bats
        continue-on-error: true
        timeout-minutes: 30
        working-directory: engine
        run: |
          brew install bats-core >/dev/null 2>&1 || true
          bats --tap tests/ 2>&1 | tee ../out/logs/bats.log; exit ${PIPESTATUS[0]}

      - name: 汇总
        if: always()
        run: |
          {
            echo "swift build: ${{ steps.build.outcome }}"
            echo "swift test:  ${{ steps.test.outcome }}"
            echo "打包:        ${{ steps.pack.outcome }}"
            echo "截图:        ${{ steps.shots.outcome }}"
            echo "go test:     ${{ steps.gotest.outcome }}"
            echo "bats:        ${{ steps.bats.outcome }}"
            [ -f out/logs/bats.log ] && echo "bats not ok 数: $(grep -c '^not ok' out/logs/bats.log || true) / 总: $(grep -cE '^(not )?ok' out/logs/bats.log || true)"
          } | tee out/summary.txt
          cat out/summary.txt >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: molelite-results
          path: out/
